name: imsweb

services:
  postgres:
    image: ${IMS_POSTGRES_IMAGE:-postgres:18.4-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IMS_POSTGRES_DB:-imsweb}
      POSTGRES_USER: ${IMS_POSTGRES_USER:-imsweb}
      POSTGRES_PASSWORD: ${IMS_POSTGRES_PASSWORD:-imsweb-local-password}
    ports:
      - "127.0.0.1:${IMS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rustfs:
    image: ${IMS_RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.12}
    profiles:
      - local-storage
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${IMS_RUSTFS_ACCESS_KEY:-imsweb-local}
      RUSTFS_SECRET_KEY: ${IMS_RUSTFS_SECRET_KEY:-imsweb-local-password}
    ports:
      - "127.0.0.1:${IMS_RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${IMS_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rustfs-init:
    image: ${IMS_S3_CLIENT_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    profiles:
      - local-storage
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${IMS_RUSTFS_ACCESS_KEY:-imsweb-local}
      RUSTFS_SECRET_KEY: ${IMS_RUSTFS_SECRET_KEY:-imsweb-local-password}
      IMS_RUSTFS_BUCKET: ${IMS_RUSTFS_BUCKET:-imsweb-media-local}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb --ignore-existing "local/$${IMS_RUSTFS_BUCKET}"
        cat > /tmp/policy.json <<POLICY_EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$${IMS_RUSTFS_BUCKET}/*"]
            },
            {
              "Effect": "Deny",
              "Principal": { "AWS": ["*"] },
              "Action": ["s3:GetObject"],
              "Resource": [
                "arn:aws:s3:::$${IMS_RUSTFS_BUCKET}/__protected/*",
                "arn:aws:s3:::$${IMS_RUSTFS_BUCKET}/*/__protected/*"
              ]
            }
          ]
        }
        POLICY_EOF
        mc anonymous set-json /tmp/policy.json "local/$${IMS_RUSTFS_BUCKET}"
        mc version enable "local/$${IMS_RUSTFS_BUCKET}"

  api:
    image: ${IMS_API_IMAGE:-imsweb-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        DEBIAN_MIRROR_BASE: ${IMS_DEBIAN_MIRROR_BASE:-http://deb.debian.org}
        NPM_REGISTRY: ${IMS_NPM_REGISTRY:-https://registry.npmmirror.com}
        NODE_HEADERS_MIRROR: ${IMS_NODE_HEADERS_MIRROR:-https://npmmirror.com/mirrors/node}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
        required: false
    environment:
      NODE_ENV: ${IMS_API_NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      IMS_ENV_FILE: ""
      IMS_BACKOFFICE_JWT_SECRET: ${IMS_BACKOFFICE_JWT_SECRET-}
      IMS_JWT_SECRET: ${IMS_JWT_SECRET-}
      IMS_PLATFORM_JWT_SECRET: ${IMS_PLATFORM_JWT_SECRET-}
      IMS_PLATFORM_EMAIL_DELIVERY: ${IMS_PLATFORM_EMAIL_DELIVERY-}
      IMS_CLOUDFLARE_EMAIL_ACCOUNT_ID: ${IMS_CLOUDFLARE_EMAIL_ACCOUNT_ID-}
      IMS_CLOUDFLARE_EMAIL_API_TOKEN: ${IMS_CLOUDFLARE_EMAIL_API_TOKEN-}
      IMS_PLATFORM_EMAIL_FROM: ${IMS_PLATFORM_EMAIL_FROM-}
      IMS_PLATFORM_EMAIL_FROM_NAME: ${IMS_PLATFORM_EMAIL_FROM_NAME:-IMSWeb}
      IMS_COOKIE_SECURE: ${IMS_COOKIE_SECURE:-false}
      IMS_SUPER_ADMIN_USERNAME: ${IMS_SUPER_ADMIN_USERNAME-}
      IMS_CLIENT_ADDRESS_SOURCE: ${IMS_CLIENT_ADDRESS_SOURCE:-direct}
      IMS_FUDABA_PUBLIC_READ_ENABLED: ${IMS_FUDABA_PUBLIC_READ_ENABLED:-false}
      IMS_FUDABA_WRITE_ENABLED: ${IMS_FUDABA_WRITE_ENABLED:-false}
      IMS_FUDABA_MAP_ENABLED: ${IMS_FUDABA_MAP_ENABLED:-false}
      IMS_FUDABA_MAP_STYLE_URL: ${IMS_FUDABA_MAP_STYLE_URL-}
      DATABASE_URL: ${IMS_API_DATABASE_URL:-postgresql://imsweb:imsweb-local-password@postgres:5432/imsweb}
      IMS_PG_POOL_MAX: ${IMS_PG_POOL_MAX:-10}
      IMS_PG_IDLE_TIMEOUT_MS: ${IMS_PG_IDLE_TIMEOUT_MS:-30000}
      IMS_PG_CONNECTION_TIMEOUT_MS: ${IMS_PG_CONNECTION_TIMEOUT_MS-}
      IMS_PG_STATEMENT_TIMEOUT_MS: ${IMS_PG_STATEMENT_TIMEOUT_MS:-30000}
      IMS_PG_IDLE_TRANSACTION_TIMEOUT_MS: ${IMS_PG_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      IMS_OBJECT_STORAGE: ${IMS_OBJECT_STORAGE:-s3}
      IMS_S3_BUCKET: ${IMS_S3_BUCKET:-imsweb-media-local}
      IMS_S3_PUBLIC_READ_URL_BASE: ${IMS_S3_PUBLIC_READ_URL_BASE:-}
      IMS_PUBLIC_READ_URL_BASE: ${IMS_PUBLIC_READ_URL_BASE:-}
      IMS_S3_REGION: ${IMS_S3_REGION:-us-east-1}
      IMS_S3_ENDPOINT: ${IMS_S3_ENDPOINT:-http://rustfs:9000}
      IMS_S3_FORCE_PATH_STYLE: ${IMS_S3_FORCE_PATH_STYLE:-true}
      IMS_S3_PREFIX: ${IMS_S3_PREFIX-}
      IMS_S3_READ_URL_TTL_SECONDS: ${IMS_S3_READ_URL_TTL_SECONDS:-300}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-imsweb-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-imsweb-local-password}
      IMS_PROJECT_ROOT: /app
      IMS_PUBLIC_DIR: /app/apps/api/dist/node-client
      IMS_COMPENSATION_DIR: /app/data/core/compensation
      IMS_IDEMPOTENCY_DIR: /app/data/core/idempotency
      IMS_UPLOADS_DIR: /app/data/uploads
      IMS_EVENT_BASE_DIR: /app/data/chronicle
      IMS_STORY_DATA_DIR: /app/data/story/images
    command:
      - /bin/sh
      - -ec
      - |
        node apps/api/scripts/migration/postgres-migrations.js
        exec node apps/api/dist/server/main.js
    ports:
      - "127.0.0.1:${IMS_API_PORT:-3000}:3000"
    volumes:
      - api-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgresql-data:
    name: imsweb-postgresql_postgresql-data
  rustfs-data:
    name: imsweb-rustfs_rustfs-data
  api-data:
    name: imsweb-api_api-data
